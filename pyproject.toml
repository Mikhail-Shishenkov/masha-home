[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "masha-home"
version = "0.1.0.dev0"
description = "Local-first personal AI companion and shared digital space"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jsonschema>=4.26,<5",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
ui = [
    "PySide6>=6.8,<6.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.data-files]
"share/masha-home/frontend" = ["frontend/index.html"]
"share/masha-home/frontend/renderer" = ["frontend/renderer/*.js"]
"share/masha-home/frontend/styles" = ["frontend/styles/*.css"]
"share/masha-home/frontend/scenes" = ["frontend/scenes/*.js", "frontend/scenes/*.cjs"]
"share/masha-home/frontend/assets" = ["frontend/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
